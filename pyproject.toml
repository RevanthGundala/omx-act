[project]
name = "omx-act"
version = "0.1.0"
description = "Custom ACT and DAgger for an OpenMANIPULATOR-X sponge-on-hot-pad task. Robot control lives in omx-training."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # core
    "torch",
    "torchvision",
    "numpy",
    "einops>=0.8",
    # LeRobot stack (datasets, stock ACT policy, train/eval)
    "lerobot[async,diffusion,dynamixel,training]>=0.5.1",
    "accelerate",
    "huggingface-hub>=1.0,<2.0",
    # dataset parquet/video handling
    "h5py>=3.15",
    "pandas",
    "pyarrow",
    "av>=15,<16",
    # experiment tracking (optional; disable with ACT_DISABLE_MLFLOW=1)
    "mlflow>=2.17",
    "modal",
    "opencv-python-headless",
    "vastai-sdk>=0.1.33",
]

[tool.uv]
# Resolve for both macOS (CPU) and Linux (CUDA) so uv sync works on either.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.setuptools.packages.find]
include = ["configs*", "models*", "train*", "scripts*", "utils*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # utils/analysis/attention_maps.py
    "matplotlib",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs network / Hugging Face (excluded from default pytest)",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "87242cfced5228b6181fb0047021d684d424df38" }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
