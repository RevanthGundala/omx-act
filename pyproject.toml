[project]
name = "act-sim"
version = "0.1.0"
description = "Custom ACT, DAgger, and RECAP for an OpenMANIPULATOR-X sponge-on-hot-pad task. Robot control lives in omx-training."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # core
    "torch",
    "torchvision",
    "numpy",
    "einops>=0.8",
    # LeRobot stack (datasets, stock ACT policy, train/eval)
    "lerobot[async,diffusion,dynamixel,training]>=0.5.1",
    "accelerate",
    "huggingface-hub>=1.0,<2.0",
    # dataset parquet/video handling
    "h5py>=3.15",
    "pandas",
    "pyarrow",
    "av>=15,<16",
    # experiment tracking (optional; disable with ACT_DISABLE_MLFLOW=1)
    "mlflow>=2.17",
    # Vast.ai launcher
    "vastai-sdk>=0.1.33",
]

[tool.uv]
# Resolve for both macOS (CPU) and Linux (CUDA) so uv sync works on either.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.setuptools.packages.find]
include = ["configs*", "models*", "train*", "scripts*", "utils*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # models/recap/inspect_advantage_attention.py renders attention maps
    "matplotlib",
]

[tool.pytest.ini_options]
# Without this, every module import in the suite fails unless the caller
# remembers PYTHONPATH=. -- friction that kept the tests from being run.
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "main" }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
